; FreeWalk - leave the truck and walk around in Euro Truck Simulator 2
; Every line is optional: missing values fall back to the default.
; The Save button of the settings window (Ctrl+F10) rewrites this whole file.

[keys]
toggle = F10              ; leave and return to the truck
settings = CTRL+F10       ; the settings window (NONE = disabled)
forward = W
back = S
left = A
right = D
run = SHIFT
flashlight = F            ; flashlight on/off (NONE = disabled)
flashlight_wider = NUMPAD+ ; wider beam (mouse wheel up too)
flashlight_narrower = NUMPAD- ; narrower beam (mouse wheel down too)

[walker]
walk_speed = 1.4          ; m/s
run_speed = 4             ; m/s
eye_height = 1.7          ; m above the ground
head_bob = 1              ; 1 = slight head bob while walking, 0 = off
head_bob_amplitude = 0.03 ; m
mouse_sensitivity = 0.25  ; mouse look sensitivity while walking (the game's free camera is 1)
max_distance = 150        ; m, farther than this from the truck returns you to it automatically
exit_side_distance = 1.5  ; m beyond the driver's head position, sideways
exit_face_door = 1        ; 1 = face the door when leaving, 0 = face the truck's front
exit_face_angle = 22      ; degrees, turn this much from the door towards the truck's front (negative: towards the rear)
ground_offset = 0         ; m, ground height relative to the truck's telemetry position
door_animation = 1        ; 1 = blink at the door and climb the steps when leaving and entering, 0 = instant
door_step_time = 0.8      ; s, time spent on the steps
door_fade_time = 0.25     ; s, blink fade to black and back
door_out = 0.7            ; m, door sill sideways from the head
door_sill_below_head = 1  ; m, door sill below the head
door_min_free = 0.8       ; m, free space needed in front of the door (otherwise the other door)
enter_near_door = 3       ; m, full entry animation within this, a blink from farther away
hide_hud = 1              ; 1 = speedometer and map hidden while walking
key_hints = 1             ; 1 = key hints at the bottom of the screen: get out in the cab, get in at the door
hide_driver = 1           ; 1 = the driver in the cab is hidden while you walk

[collision]
enabled = 1               ; 1 = the walker follows the ground and does not pass through walls (from the game's physics), 0 = flat ground
radius = 0.4              ; m, never closer than this to a wall
step_height = 0.45        ; m, steps up onto anything lower than this
step_down_max = 0.6       ; m, a step down bigger than this is a fall
ground_follow_time = 0.12 ; s, ground following smoothing (0 = instant)

[light]
angle = 28                ; degrees, beam angle at the middle setting
inner_angle = 12          ; degrees, sharp inner part of the beam
range = 40                ; m, how far the light reaches
brightness = 0.3          ; colour multiplier
r = 1                     ; colour, red
g = 0.96                  ; colour, green
b = 0.88                  ; colour, blue (less = more yellow)
fade_time = 0.18          ; s, fade when switching on and off
hand_right = 0.5          ; m, hand to the right of the eye
hand_down = 0.21          ; m, hand below the eye
flicker_chance = 0        ; times per hour on average the bulb plays up (0 = never)
own_light = 1             ; 1 = own light if no street lamp can be borrowed
borrow_min_distance = 300 ; m, street lamps closer than this are never taken
borrow_max_distance = 900 ; m, search within this first

[debug]
game_log = 0              ; 1 = the log lines also go to game.log.txt (FreeWalk.log is always written)
discovery_log = 0         ; 1 = diagnostic lines in FreeWalk.log every second
write_on_frame_start = 0  ; 1 = write the camera position at frame start (if the image shakes)
directinput_filter = 0    ; 1 = DirectInput keyboard filter (experimental; free the walking keys in the game's settings)
switch_test = 0           ; 1 = the key only switches to the free camera and back (for discovery)
